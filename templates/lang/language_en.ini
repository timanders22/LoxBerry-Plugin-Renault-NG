GESCHEITERT = "Pre-conditioning for %s failed"

[HEIM]
H = "Home zone"
H_TEXT = "Applies only to generation 2 vehicles that report a position. The plugin sends <span class='sm-mono'>Zuhause</span> (1/0/-1, retained) and <span class='sm-mono'>Entfernung</span> (km). The position applies as long as it is at most 60 minutes older than the last vehicle response. The coordinates are only in the configuration (0600) – never in the log, never on MQTT."
