Z1_25 = "Status | Ladestand und Reichweite (Renault) | rows: V5 = 1 “charging fault – <v1.0> %%, range <v2.0> km; check cable and charging station”; V3 = 1 “charging – <v1.0> %%, range <v2.0> km”; V6 = 1 “low – <v1.0> %%, only <v2.0> km left – please plug in”; V4 = 1 “plugged in, not charging – <v1.0> %%, range <v2.0> km (charging schedule waiting or charge target reached)”; without condition “<v1.0> %%, range <v2.0> km – not plugged in”; visualisation ON | V1 = #4, V2 = #5, V3 = #8, V4 = #9, V5 = #30, V6 = #23"
