SCHRITT1 = "Step 1: choose the path"
SCHRITT1_TEXT = "<b>MQTT is the standard path</b> for all measured values. For commands there is the endpoint from step 4."
SCHRITT2 = "Step 2: enter the subscription in the MQTT gateway"
SCHRITT3 = "Step 3: create virtual inputs"
SCHRITT3_TEXT = "The MQTT gateway creates the inputs itself as soon as the first value arrives. To have them beforehand, use the import file below."
SCHRITT4 = "Step 4: send commands"
SCHRITT4_ENDPUNKT = "The endpoint is in the unauthenticated area and is protected by the token. The self-test in the last row answers whether the token entered in Loxone is still valid — <b>without switching anything on the vehicle</b>. Response with a valid token: <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span>."
SCHRITT4_TEXT = "One <b>virtual output command</b> per command. The address of the virtual output is <span class='sm-mono'>http://&lt;LoxBerry&gt;</span>, and the command on ON is then:"
SCHRITT5 = "Step 5: failure detection"
SCHRITT5_TEXT = "If Renault goes silent, the virtual inputs keep their last value — in the app everything then looks normal. Therefore carry <span class='sm-mono'>ok</span> and <span class='sm-mono'>phpCall</span>: <span class='sm-mono'>ok</span> goes to 0 on a failed retrieval, and <span class='sm-mono'>phpCall</span> only changes on a <b>successful</b> one. Until 2.0.6 the timestamp was refreshed even on failure — so failure detection could never trigger. Set the threshold well above the retrieval interval."
SCHRITT6 = "Step 6: complete block list"
SCHRITT6_TEXT = "Work through it from top to bottom. Loxone Config finds the blocks via the block search (F5)."
SCHRITT7 = "Step 7: verification"
SCHRITT7_TEXT = "On the Test tab press <i>Fetch data now</i>, then look at the virtual inputs in Loxone Config. Whether the token is valid is answered by the self-test from step 4."
