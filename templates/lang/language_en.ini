H_VIN = "17 characters without I, O and Q. Shown in the vehicle registration and in the My Renault app under vehicle data."
H_VORLAGE = "Create everything at once"
H_VORLAGE_TEXT = "Instead of creating every input by hand, this file creates them with the correct names; the values then come from the MQTT gateway. <b>Note:</b> Loxone Config creates new objects on import and overwrites nothing — importing twice results in duplicate blocks. The address in the header is a suggestion; please check under which name the Miniserver reaches the LoxBerry."
H_WETTER = "Intended only as a fallback: for many vehicles the outside temperature comes from the Renault interface itself (topic OutTemp). The version 2.5 endpoint used here has been retired by OpenWeatherMap; if it answers with an error, that is noted in the log."
