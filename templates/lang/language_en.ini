Z1_32 = "Notification | Meldung Ladestörung (Renault) | Text: Renault NG – the car has been reporting a charging fault for 10 minutes, the cable is plugged in. Check cable, charging station and its fuse; read the status “Ladestand und Reichweite (Renault)” in the app | Input = #31"
