[BAUSTEIN]
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "In the plugin, tab “%s”: enter the My Renault user and password, the VIN and the vehicle generation, save. The vehicle name forms the names of the inputs (Renault_vehiclename_topic): with the factory name “Renault” they match the sample project, another name is already worked into the tables. Tab “%s” → “%s”; the tab “%s” then shows “Batterie-Status … OK”."
S1_SCHRITT2 = "In Loxone Config under Periphery → Virtual Inputs create one “Virtual input” each for no. 1–7. Write the name exactly as in the table – it is the name the MQTT gateway gives (complete name table above in step 3). Tick “Analog” and enter the readable name from the table (e.g. “Ladestand (Renault)”) as description. Do NOT beautify the name, otherwise the gateway creates a second input with the next value. There is deliberately no import file for these inputs."
S1_SCHRITT3 = "Create four notifications (Periphery → Messages → Notification), texts as in the table. Each gets exactly one connection."
S1_SCHRITT4 = "Create the page “Renault NG”. Drag the 7 inputs, the “Konstante 1” and the four notifications onto the page."
S1_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the table, connect from top to bottom. “Equal” and “Less”: leave the second input open and enter the comparison value in the properties window. AND no. 22: negate input I2 – click its input point in Config; it then shows a small circle. Value Validator no. 11: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0 and the failure message never triggers). Status “Ladestand und Reichweite (Renault)”: click “+” twice first (V5, V6); enter the rows of the status blocks in the given order, the one without condition last. Switch on “Statistics” on no. 4 and 5."
S1_SCHRITT6 = "Save and send to the Miniserver. Check: “Zustand (Renault)” shows “läuft – letzter erfolgreicher Abruf um …”, the heartbeat counts on every 3 minutes."
S1_H1 = "If the LoxBerry or the MQTT gateway stands still, all inputs keep their last value; only the stopped heartbeat gives it away. The message then comes after about 25 minutes (15 minutes until the Value Validator, 10 minutes confirmation). A wrong password shows up the same way – the plugin then sends nothing at all, not even ok = 0."
S1_H2 = "Only charging status 1 means “charging”, below 0 the car reports a fault – hence “Equal” and “Less” instead of a digital input."
S1_H3 = "“Ladung beendet” comes at every end of charging, also when the cable is pulled during charging. A charge only counts after one minute; a short outlier reports nothing."
S1_H4 = "Announcements (“charging has finished” etc.) are spoken by the plugin itself (tab “%s”, section “%s”); no block is needed for them. The e-mail at a reached battery level is also set in the plugin."
S1_H5 = "Second vehicle: enter it in the plugin with its own name (e.g. “Renault2”); its inputs are then called Renault_Renault2_… Copy the blocks of this page, adapt the suffix “(Renault)” and lead the faults through further ORs (two inputs each) to the notification. The tables here apply to vehicle 1."
S2_SCHRITT1 = "In the plugin, tab “%s”, section “%s”: switch on “%s” and choose the target temperature for preconditioning, save. Without this the plugin rejects every switching command (HTTP 403)."
S2_SCHRITT2 = "Tab “%s” → “%s”. In Loxone Config: tree “Virtual Outputs” → “Predefined devices → Import template…”, file VQ_renault_steuern.xml. Import only ONCE (twice gives duplicate commands). The address in the header is a suggestion; it must be the name or IP under which the Miniserver reaches the LoxBerry. Check: open the self-test address from step 4 in the browser → SELFTEST;OK=1;TOKEN=OK."
S2_SCHRITT3 = "Create the inputs no. 3, 4, 5, 24, 25 and 26 as on page “Renault NG” (name exactly as in the table, analog, description); “Statistics” on no. 4. Create no. 6 as “Virtual text input” with exactly this title, “Use in User Interface” on."
S2_SCHRITT4 = "Create these inputs in the tree: one slider “Ladeziel (Renault) (Proz)” (Min 50, Max 100, step 5, start value 80), two switches (“Am Ladeziel anhalten (Renault)”, “Ladeplan (Renault)”) and four push buttons (“Laden anhalten”, “Laden starten”, “Klima jetzt”, “Klima aus”, each with “(Renault)”). “Anwesenheit (eigene Quelle)” is already in the tree if another sample page has been taken over; otherwise create it as a virtual input."
S2_SCHRITT5 = "Create the page “Renault NG Laden und Klima”, place everything from the table (schedule and logic via F5) and connect from top to bottom. Status “Laden (Renault)”: click “+” twice first (V5, V6). In the schedule no. 29 enter Monday to Friday 06:40–07:00 (your own departure times); AND no. 31 gets the output AQ of the schedule."
S2_SCHRITT6 = "Save and send to the Miniserver. Check: press “Klima jetzt”. In the plugin, tab “%s”, the line “Befehl acnow an … HTTP …” appears, and after the next retrieval “Klima (Renault)” shows “läuft”."
S2_H1 = "“Am Ladeziel anhalten” is meant for vehicles without their own charge target (e.g. Zoe). Newer models (Megane E-Tech, R5, R4, A290, Master) stop by themselves when a charge target is entered in the plugin; the switch then stays off. Charging can go slightly beyond the target until the next retrieval (every 3 minutes while charging)."
S2_H2 = "The switch “Ladeplan” only sends when it is switched (edge detection); a restart of the Miniserver switches nothing. It does not know what is changed in the My Renault app – the real state is shown by the text input no. 6 (ChargeMode)."
S2_H3 = "The target temperature for preconditioning is set in the plugin (tab “%s”); Loxone does not set it, so there is no controller here."
S2_H4 = "The same command for the same vehicle goes to the car only once within 60 seconds. The command titles are fixed German, also with an English interface; with several vehicles the vehicle name comes first."
S2_H5 = "An output command may only be inserted once in Loxone – “Daten sofort neu abrufen” is therefore only on the page “Renault NG Fahrzeug”."
S2_H6 = "If you control a wallbox through EVCC, use the pages “EVCC …” for charge point, PV and price charging; this page only covers what the car itself can do. Setting a charge target in both places interferes."
S3_SCHRITT1 = "Create the inputs no. 1–3, 5, 6 and 12–17 as on page “Renault NG”, no. 4, 7 and 18 as virtual text inputs (title exactly like this, “Use in User Interface” on). Set five decimal places on no. 2 and 3, switch on “Statistics” on no. 1. Add a push button “Jetzt abrufen (Renault)”."
S3_SCHRITT2 = "Create the page “Renault NG Fahrzeug”, place the blocks of the table (Pulse at, Analog Memory, Formula and Status via F5) and connect them; the command “Daten sofort neu abrufen” comes from the container “Renault steuern (LoxBerry-Plugin)”. Click “+” twice on each of the status blocks no. 11 and 19 (V5, V6). Leave Rem on the Analog Memory (default)."
S3_SCHRITT3 = "Save and send to the Miniserver. Check: press the button “Jetzt abrufen (Renault)”; odometer and position appear."
S3_H1 = "The charging history is refreshed every 10 minutes, always the latest completed charging session of the last month. Generation 2 often delivers no state of charge at the start and end; then 0 is shown there."
S3_H2 = "Generation 1 reports no position but the battery temperature; generation 2 the other way round. Status no. 11 picks its row according to no. 5."
S3_H3 = "The position is a number. Since 2.1.20, with the home zone switched on, there are the topics Zuhause (1/0/-1) and Entfernung (km)."
Z1_01 = "Virtual input (MQTT gateway) | Renault_Renault_ok | Analog on; display name “Abruf erfolgreich (Renault)”; 1 = last retrieval from Renault succeeded, 0 = failed (only comes with a real retrieval, every 6 minutes when idle) | —"
