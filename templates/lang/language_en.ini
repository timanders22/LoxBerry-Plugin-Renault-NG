H_TECHNIK = "Technical intervention"
H_THEMEN = "Published topics"
H_THEMEN_TEXT = "All values are sent <b>retained</b> — a newly connected subscriber immediately receives the last known state. This list is checked against the program code on the Test tab; until 2.0.6 it named five topics that never existed."
H_VERLAUF = "Recorded values"
