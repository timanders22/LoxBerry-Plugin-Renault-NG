[HAUS]
H = "House topics: arrival and charging costs"
H_TEXT = "The plugin reads house topics of other plugins via the MQTT gateway (no. 15) with a decoupled reader – it writes nothing under <span class='sm-mono'>haus/</span>. Everything off by default."
L_ABFAHRT_EIN = "Minutes until departure from the house topic (haus/abfahrt)"
L_ANWESEND_EIN = "Pre-conditioning only when someone is at home (haus/anwesenheit/jemand)"
L_ANKUNFT_EIN = "Fetch immediately on arrival (at most once per 30 min and vehicle)"
L_STROMPREIS_EIN = "Electricity price from the spot price plugin for the charging costs (haus/strompreis)"
L_ANKUNFT_QUELLE = "Arrival source"
H_ANKUNFT_QUELLE = "<span class='sm-mono'>tag:&lt;name&gt;</span> (BLE tag in the car, haus/tag/&lt;name&gt;/da – recommended) or <span class='sm-mono'>person:&lt;name&gt;</span> (haus/anwesenheit/&lt;name&gt;); empty = no arrival query for this vehicle. A live change from 0 to 1 queries the vehicle once, only if the last retrieval is older than 5 minutes."
L_AKKU_KWH = "Usable battery capacity in kWh (for the charging costs only)"
H_AKKU_KWH = "Only needed if the vehicle does not report the energy in the battery (generation 1 and some models). Empty: the costs then have no statement."
H_KOSTEN = "Calculation: Renault does not report the charging power every minute. The energy per section between two retrievals comes from the <b>energy in the battery reported by the vehicle</b>, otherwise from the <b>charge level difference × entered capacity</b>; every minute carries the price the plugin records in it from <span class='sm-mono'>haus/strompreis</span> (final price without base fee). Calculated is the energy charged into the battery, <b>without charging losses</b>. Costs -1 if the energy cannot be determined, the price is missing for more than 10 percent of the energy or the charge did not start at home (home zone) – <b>never estimated</b>."
H_LADUNGEN = "Charging costs of the last charges"
H_KEINE_LADUNG = "No charge completed yet."
S_ENDE = "End"
S_KWH = "Battery (kWh)"
S_PREIS = "Ø price (ct/kWh)"
S_KOSTEN = "Cost (€)"
S_GRUND = "Reason"
Q_ABFAHRT = "House topic departure (haus/abfahrt)"
Q_ANWESENHEIT = "House topic presence (haus/anwesenheit)"
Q_STROMPREIS = "House topic electricity price (haus/strompreis)"
FRISCH = "fresh (counter %d s ago)"
SCHWEIGT = "silent for %s – %s applies"
NIE = "the start (never seen live)"
RUECK_ABFAHRT = "no pre-conditioning by the plugin (path without house topic: timer in Loxone)"
RUECK_ANWESENHEIT = "presence not set (pre-conditioning as without this checkbox), no arrival query"
