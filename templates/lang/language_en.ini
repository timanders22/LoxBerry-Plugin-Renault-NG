H_ABO_WO = "Subscription for gateway V1 (fallback):"
H_THEMEN = "Published topics"
H_THEMEN_TEXT = "<b>States</b> of the vehicle (charging status, cable, charge mode, climate control, name, mileage) are sent <b>retained</b> — a newly connected subscriber immediately receives the last known state. <b>Measurements</b>, the <b>heartbeat</b> and <b>ok</b> (whether the last fetch of the plugin succeeded) are sent without retain, so that no old value appears fresh and a stopped plugin does not report ok; an empty value is never retained. Values that earlier versions retained are cleared once by the plugin. The <i>retained</i> column comes from the same table the plugin sends by. This list is checked against the program code on the Test tab; until 2.0.6 it named five topics that never existed."
S_PHASE = "phase %s"
S_THEMA = "Topic"
S_BEDEUTUNG = "Meaning"
H_LOXONE = "Loxone integration, step by step"
H_LOXONE_TEXT = "The plugin fetches the vehicle data from Renault and publishes it to the MQTT broker. Loxone reads it via MQTT gateway V2 (tick the data points). Since 2.1.20 Loxone sends commands via the command bridge (UDP to the gateway); the previous HTTP endpoint is kept, collapsed."
SCHRITT1 = "Step 1: choose the path"
SCHRITT1_TEXT = "<b>MQTT is the standard path</b> for all measured values (gateway V2, step 2) and for commands (command bridge, step 3). The previous HTTP endpoint is collapsed below; new installations do not need it."
SCHRITT2 = "Step 2: gateway V2 – tick the data points"
SCHRITT3 = "For step 2: the names of the virtual inputs"
SCHRITT3_TEXT = "The MQTT gateway creates the inputs itself as soon as the first value arrives. The title is the topic with underscores instead of slashes and must not be changed — otherwise the next value creates a second input. Set the readable name in Loxone Config from the <i>Meaning</i> column. Since 2.1.9 there is no import file for the inputs any more; anyone who imported it earlier keeps those inputs, and they keep receiving values. Five topics carry text instead of a number: <span class='sm-mono'>Name</span>, <span class='sm-mono'>HvAcStatus</span> (<span class='sm-mono'>on</span>/<span class='sm-mono'>off</span>), <span class='sm-mono'>ChargeMode</span>, <span class='sm-mono'>GPSTime</span> (time as <span class='sm-mono'>HH:MM</span>) and <span class='sm-mono'>chargeEndStatus</span> (final status reported by the Renault interface); they belong on a virtual text input — for climate control there is <span class='sm-mono'>HvAcStatusBin</span> as a number. <span class='sm-mono'>HvAcStatus</span> and <span class='sm-mono'>ChargeMode</span> read <span class='sm-mono'>n/a</span> if the vehicle does not know the query. A state without a value reads <span class='sm-mono'>-</span>; a measured value without a value is not sent, and the input keeps its last value."
S_TITEL = "Title"
S_EINHEIT = "Unit"
H_VORLAGE = "Import file for the commands"
H_VORLAGE_TEXT = "This file creates the commands from step 4 as virtual outputs, including the action token. <b>Note:</b> Loxone Config creates new objects on import and overwrites nothing — importing twice results in duplicate blocks. The address in the header is a suggestion; please check under which name the Miniserver reaches the LoxBerry. Since 2.1.19 the command titles are fixed German (as in the sample project), also with an English interface; only the comments are translated."
K_VORLAGE_VQ = "Create import file for the commands"
SCHRITT4 = "Commands via the HTTP endpoint (previous path)"
SCHRITT4_TEXT = "One <b>virtual output command</b> per command. The address of the virtual output is <span class='sm-mono'>%s</span>, and the command on ON is then:"
SCHRITT4_ENDPUNKT = "The endpoint is in the unauthenticated area and is protected by the token. The self-test in the last row answers whether the token entered in Loxone is still valid — <b>without switching anything on the vehicle</b>. Response with a valid token: <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span>. The same switching command for the same vehicle is sent to Renault only once within 60 seconds; a repetition answers HTTP 200 with <span class='sm-mono'>UNVERAENDERT=1</span>, a different command goes out at once."
