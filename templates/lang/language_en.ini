WAS_IST_DAS = "<b>Renault electric vehicles on the Loxone Miniserver – via the My Renault account.</b> A poll at the configured interval (cron, no service of its own) fetches battery level, range, charging state, mileage, location and further values for up to four vehicles through the My Renault interface. The values reach the Miniserver over MQTT through the LoxBerry MQTT Gateway. Pre-conditioning and charging control can be triggered from Loxone through a token-protected HTTP endpoint – switching commands are disabled by default."

