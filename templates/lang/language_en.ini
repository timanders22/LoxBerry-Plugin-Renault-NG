[VORKLIMA]
H = "Pre-conditioning for departure"
H_EINE_QUELLE = "<b>Use only one source:</b> timer in Loxone <b>or</b> this checkbox – otherwise two commands arrive."
H_TEXT = "Triggers pre-conditioning with a fresh house topic <span class='sm-mono'>haus/abfahrt</span> (departure assistant) and 1 ≤ minutes to departure ≤ lead time – <b>at most two</b> climate-on per departure (send – retrieve – send), then a LoxBerry notification. Works only with <i>Switching</i> on, the checkbox for the departure house topic and credentials. If the house topic is silent or reports -1, the plugin does <b>not</b> pre-condition."
L_EIN = "Pre-conditioning for departure (off by default)"
L_WETTER_EIN = "Only when cold or hot (weather limit)"
L_VORLAUF = "Lead time in minutes (5–60)"
L_FAHRZEUGE = "Vehicles (numbers, e.g. 1 or 1,2)"
L_KALT = "Cold below (°C)"
L_HEISS = "Hot above (°C)"
H_WETTER = "Weather limit: first the outside temperature from Loxone (<span class='sm-mono'>Renault/befehl/aussentemp</span>, at most 30 min old), otherwise the vehicle's (from a retrieval at most 60 min old). If it lies between cold and hot, pre-conditioning is skipped (Vorklima 2). Without a statement it pre-conditions."
