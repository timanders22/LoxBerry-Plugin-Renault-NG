S_SELBSTTEST = "Self-test (switches nothing)"
H_STEUERUNG_AUS = "<b>Switching is disabled.</b> Switching commands are rejected with HTTP 403. Enable it on the Settings tab, section Switching. Read-only calls (<span class='sm-mono'>aktion=abruf</span>) and the self-test still work."
K_TOKEN_NEU = "Generate a new token"
SCHRITT5 = "Step 4: failure detection"
SCHRITT5_TEXT = "If Renault goes silent or the LoxBerry stands still, the virtual inputs keep their last value — in the app everything then looks normal. Therefore carry two signs (page “Renault NG” in step 6): the <b>heartbeat</b> <span class='sm-mono'>status/zaehler</span> counts up by one with every run of the plugin (every 3 minutes), even without a retrieval; a Value Validator (Tmc 900 s) reports when it stops – then the LoxBerry, the MQTT gateway or the login at Renault is stuck (since 2.1.20 a login error sends ok = 0 and the heartbeat per vehicle). <span class='sm-mono'>ok</span> goes to 0 on a failed retrieval. <span class='sm-mono'>phpCall</span> only shows the time of the last successful retrieval. Until 2.1.18 this step named <span class='sm-mono'>ok</span> and <span class='sm-mono'>phpCall</span> with a stairwell light switch – it was on in normal operation and did not detect a failure."
SCHRITT6 = "Step 5: three pages from the sample project to rebuild"
SCHRITT6_TEXT = "Three pages from the LoxBerry plugins sample project, built and connected there in Loxone Config. One block per row; Loxone Config finds them all via the block search (key F5). If you only want monitoring, take over the first page alone; “Laden und Klima” needs switching to be enabled, “Fahrzeug” is display only. The tables apply to vehicle 1: the names of the gateway inputs are worked out from the configured vehicle name (Renault_<i>vehiclename</i>_<i>topic</i>, as in step 3), the command titles are fixed German, also with an English interface."
