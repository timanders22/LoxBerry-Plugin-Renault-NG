H_SCHALTEN_TEXT = "<b>Off by default.</b> While this switch is off, the endpoint rejects every command that changes anything on the vehicle — preconditioning, charging, charging schedule. Read-only calls are not affected. A freshly installed plugin must not be able to start the air conditioning right away."
