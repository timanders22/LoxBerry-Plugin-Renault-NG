SCHRITT3 = "Schritt 3: Die Namen der virtuellen Eingänge"
SCHRITT3_TEXT = "Das MQTT-Gateway legt die Eingänge selbst an, sobald der erste Wert ankommt. Der Titel ist das Thema mit Unterstrich statt Schrägstrich und darf nicht geändert werden — sonst entsteht beim nächsten Wert ein zweiter Eingang. Den lesbaren Namen setzen Sie in Loxone Config aus der Spalte <i>Bedeutung</i>. Eine Importdatei für die Eingänge gibt es seit 2.1.9 nicht mehr; wer sie früher eingelesen hat, behält seine Eingänge, und sie bekommen weiter Werte. Fünf Themen tragen Text statt einer Zahl: <span class='sm-mono'>Name</span>, <span class='sm-mono'>HvAcStatus</span> (<span class='sm-mono'>on</span>/<span class='sm-mono'>off</span>), <span class='sm-mono'>ChargeMode</span>, <span class='sm-mono'>GPSTime</span> (Uhrzeit als <span class='sm-mono'>HH:MM</span>) und <span class='sm-mono'>chargeEndStatus</span> (Abschlussmeldung der Renault-Schnittstelle); sie gehören an einen virtuellen Texteingang — für die Klimatisierung gibt es <span class='sm-mono'>HvAcStatusBin</span> als Zahl. <span class='sm-mono'>HvAcStatus</span> und <span class='sm-mono'>ChargeMode</span> lauten <span class='sm-mono'>n/a</span>, wenn das Fahrzeug die Abfrage nicht kennt. Ein Zustand ohne Wert steht als <span class='sm-mono'>-</span> da; ein Messwert ohne Wert wird nicht gesendet, der Eingang behält dann seinen letzten Wert."
