[BAUSTEIN]
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
S1_SCHRITT1 = "Im Plugin, Reiter „%s“: My-Renault-Benutzer und Passwort, Fahrgestellnummer und Fahrzeuggeneration eintragen, speichern. Der Fahrzeugname bildet die Namen der Eingänge (Renault_Fahrzeugname_Thema): mit dem Werksnamen „Renault“ gleichen sie dem Musterprojekt, ein anderer Name ist in den Tabellen schon eingerechnet. Reiter „%s“ → „%s“; im Reiter „%s“ steht danach „Batterie-Status … OK“."
S1_SCHRITT2 = "In Loxone Config unter Peripherie → Virtuelle Eingänge für Nr. 1–7 je einen „Virtuellen Eingang“ anlegen. Die Bezeichnung genau so schreiben wie in der Tabelle – das ist der Name, den das MQTT-Gateway vergibt (vollständige Namenstabelle oben in Schritt 3). Haken „Analog“ setzen und den lesbaren Namen aus der Tabelle (z. B. „Ladestand (Renault)“) als Beschreibung eintragen. Die Bezeichnung NICHT verschönern, sonst legt das Gateway beim nächsten Wert einen zweiten Eingang an. Eine Importdatei für diese Eingänge gibt es bewusst nicht."
S1_SCHRITT3 = "Vier Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung), Texte wie in der Tabelle. Jede bekommt genau eine Leitung."
S1_SCHRITT4 = "Seite „Renault NG“ anlegen. Die 7 Eingänge, die „Konstante 1“ und die vier Benachrichtigungen auf die Seite ziehen."
S1_SCHRITT5 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden. „Gleich“ und „Kleiner“: den zweiten Eingang offen lassen, den Vergleichswert im Eigenschaftsfenster eintragen. UND Nr. 22: den Eingang I2 negieren – in Config auf seinen Eingangspunkt klicken, danach zeigt er einen kleinen Kreis. Analogwertvalidierung Nr. 11: den Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus). Status „Ladestand und Reichweite (Renault)“: vorher zweimal „+“ klicken (V5, V6); die Zeilen der Status-Bausteine in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt. „Statistik“ an Nr. 4 und 5 einschalten."
S1_SCHRITT6 = "Speichern und übertragen. Probe: „Zustand (Renault)“ zeigt „läuft – letzter erfolgreicher Abruf um …“, das Lebenszeichen zählt alle 3 Minuten weiter."
S1_H1 = "Steht der LoxBerry oder das MQTT-Gateway, behalten alle Eingänge ihren letzten Wert; nur das stehende Lebenszeichen verrät es. Die Meldung kommt dann nach etwa 25 Minuten (15 Minuten bis zur Analogwertvalidierung, 10 Minuten Bestätigung). Ein falsches Passwort zeigt sich ebenso – das Plugin sendet dann gar nichts, auch kein ok = 0."
S1_H2 = "Nur der Ladestatus 1 heißt „lädt“, unter 0 meldet das Auto eine Störung – deshalb „Gleich“ und „Kleiner“ statt eines Digitaleingangs."
S1_H3 = "„Ladung beendet“ kommt bei jedem Ladeende, auch wenn das Kabel während der Ladung gezogen wird. Erst nach einer Minute Laden zählt die Ladung; ein kurzer Ausreißer meldet nichts."
S1_H4 = "Ansagen („Die Ladung ist beendet“ usw.) spricht das Plugin selbst (Reiter „%s“, Abschnitt „%s“); dafür braucht es keinen Baustein. Die Mail bei erreichtem Akkustand stellt man ebenfalls im Plugin ein."
S1_H5 = "Zweites Fahrzeug: im Plugin mit eigenem Namen eintragen (z. B. „Renault2“); seine Eingänge heißen dann Renault_Renault2_… Die Bausteine dieser Seite kopieren, den Zusatz „(Renault)“ anpassen und die Störungen über weitere ODER (je zwei Eingänge) vor die Benachrichtigung führen. Die Tabellen hier gelten für Fahrzeug 1."
S2_SCHRITT1 = "Im Plugin, Reiter „%s“, Abschnitt „%s“: „%s“ einschalten und die Zieltemperatur der Vorklimatisierung wählen, speichern. Ohne das weist das Plugin jeden schaltenden Befehl ab (HTTP 403)."
S2_SCHRITT2 = "Reiter „%s“ → „%s“. In Loxone Config: Baum „Virtuelle Ausgänge“ → „Vordefinierte Geräte → Vorlage importieren…“, Datei VQ_renault_steuern.xml. Nur EINMAL einlesen (zweimal ergibt doppelte Befehle). Die Adresse im Kopf ist ein Vorschlag; sie muss der Name oder die IP sein, unter der der Miniserver den LoxBerry erreicht. Probe: die Selbsttest-Adresse aus Schritt 4 im Browser öffnen → SELFTEST;OK=1;TOKEN=OK."
S2_SCHRITT3 = "Die Eingänge Nr. 3, 4, 5, 24, 25 und 26 wie auf Seite „Renault NG“ anlegen (Bezeichnung genau wie in der Tabelle, Analog, Beschreibung); „Statistik“ an Nr. 4. Nr. 6 als „Virtueller Texteingang“ mit genau diesem Titel anlegen, „In Visualisierung verwenden“ an."
S2_SCHRITT4 = "Im Baum diese Eingänge anlegen: einen Schieberegler „Ladeziel (Renault) (Proz)“ (Min 50, Max 100, Schritt 5, Startwert 80), zwei Schalter („Am Ladeziel anhalten (Renault)“, „Ladeplan (Renault)“) und vier Tasten („Laden anhalten“, „Laden starten“, „Klima jetzt“, „Klima aus“, je mit „(Renault)“). „Anwesenheit (eigene Quelle)“ steht schon im Baum, wenn eine andere Musterseite übernommen ist; sonst als Virtuellen Eingang anlegen."
S2_SCHRITT5 = "Seite „Renault NG Laden und Klima“ anlegen, alles aus der Tabelle setzen (Schaltuhr und Logik über F5) und von oben nach unten verbinden. Status „Laden (Renault)“: vorher zweimal „+“ klicken (V5, V6). In der Schaltuhr Nr. 29 Montag bis Freitag 06:40–07:00 eintragen (eigene Abfahrtszeiten); UND Nr. 31 bekommt den Ausgang AQ der Schaltuhr."
S2_SCHRITT6 = "Speichern und übertragen. Probe: „Klima jetzt“ drücken. Im Plugin, Reiter „%s“, steht danach „Befehl acnow an … HTTP …“, und nach dem nächsten Abruf zeigt „Klima (Renault)“ „läuft“."
S2_H1 = "„Am Ladeziel anhalten“ ist für Fahrzeuge ohne eigenes Ladeziel gedacht (z. B. Zoe). Neuere Modelle (Megane E-Tech, R5, R4, A290, Master) halten selbst an, wenn im Plugin ein Ladeziel eingetragen ist; der Schalter bleibt dann aus. Das Laden kann bis zum nächsten Abruf (beim Laden alle 3 Minuten) etwas über das Ziel gehen."
S2_H2 = "Der Schalter „Ladeplan“ sendet nur beim Umschalten (Flankenerkennung); ein Neustart des Miniservers schaltet nichts um. Was in der My-Renault-App umgestellt wird, kennt er nicht – den echten Stand zeigt der Texteingang Nr. 6 (ChargeMode)."
S2_H3 = "Die Zieltemperatur der Vorklimatisierung stellt das Plugin ein (Reiter „%s“); Loxone gibt sie nicht vor, deshalb gibt es hier keinen Regler."
S2_H4 = "Derselbe Befehl für dasselbe Fahrzeug geht innerhalb von 60 Sekunden nur einmal ans Auto. Die Befehlstitel sind fest deutsch, auch bei englischer Oberfläche; bei mehreren Fahrzeugen steht der Fahrzeugname vorn."
S2_H5 = "Ein Ausgangsbefehl darf in Loxone nur einmal eingefügt werden – „Daten sofort neu abrufen“ steht deshalb nur auf der Seite „Renault NG Fahrzeug“."
S2_H6 = "Wer eine Wallbox über EVCC regelt, nimmt für Ladepunkt, PV- und Preisladen die Seiten „EVCC …“; hier steht nur, was das Auto selbst kann. Beides zugleich mit einem Ladeziel einzustellen, stört sich."
S3_SCHRITT1 = "Die Eingänge Nr. 1–3, 5, 6 und 12–17 wie auf Seite „Renault NG“ anlegen, Nr. 4, 7 und 18 als Virtuelle Texteingänge (Titel genau so, „In Visualisierung verwenden“ an). An Nr. 2 und 3 fünf Nachkommastellen einstellen, an Nr. 1 „Statistik“ einschalten. Dazu eine Taste „Jetzt abrufen (Renault)“."
S3_SCHRITT2 = "Seite „Renault NG Fahrzeug“ anlegen, die Bausteine der Tabelle setzen (Impuls um, Analogspeicher, Formel und Status über F5) und verbinden; der Befehl „Daten sofort neu abrufen“ kommt aus dem Behälter „Renault steuern (LoxBerry-Plugin)“. An den Status Nr. 11 und 19 je zweimal „+“ klicken (V5, V6). Den Analogspeicher mit Rem lassen (Vorgabe)."
S3_SCHRITT3 = "Speichern und übertragen. Probe: die Taste „Jetzt abrufen (Renault)“ drücken; Kilometerstand und Position erscheinen."
S3_H1 = "Die Ladehistorie kommt alle 10 Minuten neu, immer der jüngste abgeschlossene Ladevorgang des letzten Monats. Generation 2 liefert oft keinen Ladestand am Anfang und Ende; dann stehen dort 0."
S3_H2 = "Generation 1 meldet keine Position, dafür die Batterietemperatur; Generation 2 umgekehrt. Der Status Nr. 11 wählt seine Zeile nach Nr. 5."
S3_H3 = "Die Position ist eine Zahl; eine Anzeige „zu Hause/unterwegs“ gibt das Plugin nicht her."
