K_TOKEN_NEU = "Neues Token erzeugen"
SCHRITT5 = "Schritt 5: Ausfallerkennung"
SCHRITT5_TEXT = "Schweigt Renault oder steht der LoxBerry, behalten die virtuellen Eingänge ihren letzten Wert — in der App sieht dann alles normal aus. Deshalb zwei Zeichen mitführen (Seite „Renault NG“ in Schritt 6): Das <b>Lebenszeichen</b> <span class='sm-mono'>status/zaehler</span> zählt bei jedem Durchgang des Plugins (alle 3 Minuten) eins weiter, auch ohne Abruf; eine Analogwertvalidierung (Tmc 900 s) meldet, wenn es steht – dann steht der LoxBerry, das MQTT-Gateway oder die Anmeldung bei Renault (bei einem Anmeldefehler sendet das Plugin gar nichts). <span class='sm-mono'>ok</span> geht bei einem gescheiterten Abruf auf 0. <span class='sm-mono'>phpCall</span> zeigt nur die Uhrzeit des letzten erfolgreichen Abrufs. Bis 2.1.18 nannte dieser Schritt <span class='sm-mono'>ok</span> und <span class='sm-mono'>phpCall</span> mit einem Treppenlichtschalter – der stand im Normalbetrieb auf Ein und erkannte keinen Ausfall."
SCHRITT6 = "Schritt 6: Drei Seiten aus dem Musterprojekt zum Nachbauen"
SCHRITT6_TEXT = "Drei Seiten aus dem LoxBerry-Plugins Musterprojekt, dort in Loxone Config gebaut und verbunden. Jede Zeile ein Baustein; Loxone Config findet alle über die Baustein-Suche (Taste F5). Wer nur überwachen will, übernimmt die erste Seite allein; „Laden und Klima“ braucht die freigegebene Steuerung, „Fahrzeug“ ist reine Anzeige. Die Tabellen gelten für Fahrzeug 1: Die Namen der Gateway-Eingänge sind aus dem eingestellten Fahrzeugnamen gerechnet (Renault_<i>Fahrzeugname</i>_<i>Thema</i>, wie in Schritt 3), die Befehlstitel sind fest deutsch, auch bei englischer Oberfläche."
