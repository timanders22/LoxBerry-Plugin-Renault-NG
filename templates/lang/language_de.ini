H_THEMEN = "Veröffentlichte Themen"
H_THEMEN_TEXT = "<b>Zustände</b> des Fahrzeugs (Ladestatus, Kabel, Lademodus, Klimatisierung, Name, Kilometerstand) gehen <b>retained</b> hinaus — ein neu verbundener Teilnehmer bekommt sofort den letzten Stand. <b>Messwerte</b>, das <b>Lebenszeichen</b> und <b>ok</b> (ob der letzte Abruf des Plugins gelang) gehen ohne Retain hinaus, damit kein alter Wert als frisch erscheint und ein angehaltenes Plugin nicht in Ordnung meldet; ein leerer Wert geht nie retained. Was frühere Fassungen zurückbehalten haben, räumt das Plugin einmal ab. Die Spalte <i>retained</i> kommt aus derselben Tabelle, nach der gesendet wird. Diese Liste wird im Reiter Test gegen den Programmcode geprüft; bis 2.0.6 nannte sie fünf Themen, die es nie gab."
