SCHRITT4_ENDPUNKT = "Der Endpunkt liegt im unangemeldeten Bereich und ist durch das Token geschützt. Der Selbsttest in der letzten Zeile beantwortet, ob das in Loxone eingetragene Token noch stimmt — <b>ohne am Fahrzeug etwas zu schalten</b>. Antwort bei richtigem Token: <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span>. Derselbe Schaltbefehl für dasselbe Fahrzeug geht innerhalb von 60 Sekunden nur einmal an Renault; eine Wiederholung antwortet mit HTTP 200 und <span class='sm-mono'>UNVERAENDERT=1</span>, ein anderer Befehl geht sofort hinaus."
