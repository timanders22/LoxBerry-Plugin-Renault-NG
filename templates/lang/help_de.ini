; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Renault NG"
K02 = "Verbindet Renault-Elektrofahrzeuge (Zoe PH1/PH2, Twingo Electric u. a.) mit dem Loxone Miniserver – über den LoxBerry. Batteriestand, Reichweite, Ladestatus, Kilometerstand, Position u. v. m. werden regelmäßig abgerufen und per <b>MQTT</b> (LoxBerry MQTT Gateway) bereitgestellt. Vorklimatisierung und Ladesteuerung lassen sich aus Loxone heraus auslösen."
K03 = "Fortführung des Renault-Plugins von PeterB, das seinerseits auf <a href='https://github.com/db-EV/ZoePHP' target='_blank'>ZoePHP</a> von db-EV aufbaut. Apache-Lizenz 2.0; die Liste der Änderungen steht in NOTICE."
K04 = "Funktionen"
K05 = "Abruf von Batterie-, Lade- und Fahrzeugdaten über die My-Renault-Schnittstelle (Gigya/Kamereon), für bis zu vier Fahrzeuge desselben Kontos"
K06 = "MQTT über das LoxBerry MQTT Gateway, alle Werte retained, Themen <code>Renault/&lt;Fahrzeugname&gt;/...</code>"
K07 = "Befehle: Vorklimatisierung an und aus, Sofortladen, Laden anhalten, Ladeplan an und aus – über den Endpunkt <code>/plugins/renault_ng/index.php?token=&lt;TOKEN&gt;&amp;aktion=acnow</code>. Ab Werk gesperrt, siehe Einstellungen."
K08 = "Ladehistorie mit Tagesdiagramm, Ausfallerkennung über die Themen <code>ok</code> und <code>phpCall</code>"
K09 = "Reiter <b>Einstellungen</b>, <b>MQTT</b>, <b>Einbindung in Loxone</b> (Schritt für Schritt mit kompletter Baustein-Liste), <b>Test</b>, <b>Ladehistorie</b> und <b>Logdateien</b>"
K10 = "Was sich zuletzt geändert hat"
K11 = "<b>2.1.6 — die Konfiguration heilt sich nach Inhalt.</b> Eine leere, unlesbare oder halb geschriebene <code>config.php</code> wurde bis 2.1.5 wie eine Werkseinstellung gelesen: neues Aktionstoken, Kennwort und Fahrgestellnummern fort — und die heile Zweitschrift daneben wurde dabei überschrieben. Jetzt wird sie erkannt, aus der Zweitschrift wiederhergestellt und einmal ins Protokoll geschrieben."
K12 = "<b>2.1.6 — der Endpunkt sagt die Wahrheit.</b> Er antwortete auf jeden Fehler mit HTTP 200; Loxone wertet aber nur den Statuscode aus. Jetzt kommen 502, 503, 403 und 409 durch, jede Abweisung steht im Protokoll, und ein Ladefehler erzeugt keinen leeren HTTP 500 mehr. Eine Fahrzeugnummer, die nicht aus Ziffern besteht, wird abgewiesen statt stillschweigend auf ein anderes Fahrzeug gebogen."
K13 = "Neu in der Oberfläche"
K14 = "Abruftakt, Meldeschwelle, Mail- und Befehlsauslöser, Wetterschlüssel und ABRP standen bis 2.0.6 nur in der Konfigurationsdatei. Sie haben jetzt Bedienfelder – und stehen ab Werk aus."
K15 = "Bis zu vier Fahrzeuge, Zieltemperatur der Vorklimatisierung, Ladeziel (nur neuere Plattformen), Tagesdiagramm der Ladehistorie"
K16 = "Selbsttest <code>?selftest=1&amp;token=…</code>: prüft das in Loxone eingetragene Token, ohne am Fahrzeug etwas zu schalten"
K17 = "Installation"
K18 = "ZIP über die LoxBerry-Pluginverwaltung installieren, dann im Reiter <b>Einstellungen</b> die My-Renault-Zugangsdaten, die Fahrgestellnummer und die Fahrzeuggeneration eintragen. Alles Weitere erklärt der Reiter <b>Einbindung in Loxone</b>."
K19 = "Hinweise"
K20 = "Höchstens ein Abruf je Minute – das hält das Plugin selbst ein"
K21 = "Bei „There is no data for this vin and uid“: Datenfreigabe im Fahrzeug aktivieren und prüfen, ob die My-Renault-App Live-Daten zeigt. Das Protokoll listet in diesem Fall die im Konto verknüpften Fahrgestellnummern auf."
K22 = "Die Zugangsdaten bleiben lokal auf dem LoxBerry, in config.php mit den Rechten 0600"
