; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Renault NG"
K02 = "Verbindet Renault-Elektrofahrzeuge (Zoe PH1/PH2, Twingo Electric u. a.) mit dem Loxone Miniserver – über den LoxBerry. Batteriestand, Reichweite, Ladestatus, Kilometerstand, Position u. v. m. werden regelmäßig abgerufen und per <b>MQTT</b> (LoxBerry MQTT Gateway) bereitgestellt. Vorklimatisierung und Ladesteuerung lassen sich aus Loxone heraus auslösen."
K03 = "Fortführung des Renault-Plugins von PeterB, das seinerseits auf <a href='https://github.com/db-EV/ZoePHP' target='_blank'>ZoePHP</a> von db-EV aufbaut. Apache-Lizenz 2.0; die Liste der Änderungen steht in NOTICE."
K04 = "Funktionen"
K05 = "Abruf von Batterie-, Lade- und Fahrzeugdaten über die My-Renault-Schnittstelle (Gigya/Kamereon), für bis zu vier Fahrzeuge desselben Kontos"
K06 = "MQTT über das LoxBerry-MQTT-Gateway <b>V2</b>: Datenpunkte einzeln anhaken (Tabelle im Reiter MQTT), Zustände retained, Messwerte und Lebenszeichen ohne Retain, Zahlthemen ohne Wert mit Fehlwert (-1, Temperaturen -99, GPS -999). Themen <code>Renault/&lt;Fahrzeugname&gt;/...</code>"
K07 = "Befehle über die <b>Befehlsbrücke</b> (MQTT, <code>Renault/befehl/laden</code>, <code>klima_an</code>, <code>klima_aus</code>, <code>ladeplan</code>, <code>auffrischen</code>, <code>aussentemp</code>; Fahrzeug 2–4 unter <code>Renault/befehl/&lt;n&gt;/…</code>) mit Quittung, ab Werk aus. Der bisherige Endpunkt <code>/plugins/renault_ng/index.php?token=…&amp;aktion=acnow</code> bleibt beim Update offen, bei einer Neuinstallation ist er aus. Schaltende Befehle wirken nur mit <i>Steuerung</i>."
K08 = "Ladehistorie mit Tagesdiagramm, Ausfallerkennung über das Lebenszeichen <code>status/zaehler</code> und das Thema <code>ok</code>"
K09 = "Reiter <b>Einstellungen</b>, <b>MQTT</b>, <b>Einbindung in Loxone</b> (Schritt für Schritt mit drei Seiten aus dem Musterprojekt, Tabellen und Bildern), <b>Test</b>, <b>Ladehistorie</b> und <b>Logdateien</b>"
K10 = "Neu in 2.1.20"
K11 = "<b>Gateway V2 und Befehlsbrücke:</b> Hakenliste mit Noncached-Angabe, Selbsttest gegen <code>subscriptions.json</code>, Kopfzeile MQTT; Befehle aus Loxone über UDP 11884 an die Brücke (im Heimnetz ohne Anmeldung erreichbar – Schutz sind die Haken <i>Befehle über MQTT annehmen</i> und <i>Steuerung</i>). Die Gleichwert-Bremse (derselbe Sollwert binnen 60 s geht nur einmal an Renault) gilt jetzt für alle Wege."
K12 = "<b>Behoben:</b> ein Kontowechsel verwirft die Anmeldung; Speichern löscht die Merker nur noch bei geänderter VIN, Phase oder geänderten Zugangsdaten, und das Update rettet sie; die Aufzeichnung schreibt nur bei einer Änderung (alte gleiche Zeilen fasst das Update einmal zusammen, mit Sicherung); die Sicherung beim Update ist unteilbar; die Deinstallation folgt keinem Verweis mehr; der Reiter Test lädt neu; Fehler des Cron stehen in <code>cron.err</code>; Sprachausgabe auch über Sonos4Lox und SonoX (Modul 1.2.0)."
K13 = "Neu in der Oberfläche"
K14 = "Abruftakt, Meldeschwelle, Mail- und Befehlsauslöser, Wetterschlüssel und ABRP standen bis 2.0.6 nur in der Konfigurationsdatei. Sie haben jetzt Bedienfelder – und stehen ab Werk aus."
K15 = "Bis zu vier Fahrzeuge, Zieltemperatur der Vorklimatisierung, Ladeziel (nur neuere Plattformen), Tagesdiagramm der Ladehistorie"
K16 = "Selbsttest <code>?selftest=1&amp;token=…</code>: prüft das in Loxone eingetragene Token, ohne am Fahrzeug etwas zu schalten"
K17 = "Installation"
K18 = "ZIP über die LoxBerry-Pluginverwaltung installieren, dann im Reiter <b>Einstellungen</b> die My-Renault-Zugangsdaten, die Fahrgestellnummer und die Fahrzeuggeneration eintragen. Alles Weitere erklärt der Reiter <b>Einbindung in Loxone</b>."
K19 = "Hinweise"
K20 = "Höchstens ein Abruf je Minute – das hält das Plugin selbst ein"
K21 = "Bei „There is no data for this vin and uid“: Datenfreigabe im Fahrzeug aktivieren und prüfen, ob die My-Renault-App Live-Daten zeigt. Das Protokoll listet in diesem Fall die im Konto verknüpften Fahrgestellnummern auf."
K22 = "Die Zugangsdaten bleiben lokal auf dem LoxBerry, in config.php mit den Rechten 0600"
K23 = "Neu in 2.1.20 – Haus-Themen und Automatik"
K24 = "<b>Vorklimatisierung zur Abfahrt</b> aus <code>haus/abfahrt</code> (Abfahrts-Assistent), wahlweise nur bei Anwesenheit und nur bei Kälte oder Hitze; höchstens zwei Klima-ein je Abfahrt, danach eine LoxBerry-Benachrichtigung. Schweigt das Haus-Thema, klimatisiert das Plugin nicht. Nur eine Quelle nutzen: Schaltuhr in Loxone oder dieser Haken."
K25 = "<b>Heimzone:</b> <code>Zuhause</code> (1/0/-1) und <code>Entfernung</code> aus der GPS-Position (Generation 2); die Koordinaten stehen nur in der Konfiguration, nie im Protokoll oder an MQTT."
K26 = "<b>Ankunft:</b> wechselt der gewählte BLE-Tag oder die gewählte Person live auf 1, fragt das Plugin das Fahrzeug einmal ab (höchstens einmal je 30 min)."
K27 = "<b>Ladekosten</b> je Ladung aus <code>haus/strompreis</code>: Energie aus der vom Fahrzeug gemeldeten Energie im Akku, sonst Akkustand-Differenz × eingetragene Kapazität; Preis je Minute mitgeschrieben (die Minuten vor dem erkannten Ladebeginn aus der Preisvorschau, nie aus dem aktuellen Preis); -1, wenn der Preis für mehr als 10 Prozent der Energie fehlt oder die Energie nicht bestimmbar ist – nie geschätzt, ohne Ladeverluste."
K28 = "<b>Meldungen an SignalBot</b> (Akkustand erreicht, Ladung beendet, Vorklimatisierung gescheitert) über dessen Brücke; wirkt nur, wenn SignalBot den Absender <code>renault_ng</code> freigibt. Das Ergebnis von <code>mail()</code> steht jetzt im Protokoll."
K29 = "<b>Healthcheck:</b> die LoxBerry-Systemseite zeigt Renault NG (nicht eingerichtet, Cron steht, letzter Erfolg, Gateway-V2-Haken, Befehlsbrücke) – nur lesend, ohne Netz."
K30 = "Das Plugin regelt das Laden nicht nach Preis oder Überschuss; dafür sind Loxone (Wallbox-Regelung) und die Werte dieses Plugins da."
K31 = "Renault-seitig ist 2.1.20 nur mit Attrappen geprüft (im Haus kein Konto) – BETA."
K32 = "<b>Mehrere Lautsprecher gleichzeitig</b> (seit 2.1.20, Sprachmodul 1.2.1): Unter der Ausgabeart (jetzt „Ziel 1“) steht die Tabelle <i>Weitere Ausgabeziele (gleichzeitig)</i> – bis zu 6 Ziele insgesamt, zum Beispiel Loxone Music Server, Google-Lautsprecher (Chromecast 4 Lox NG) und Amazon Echo (Alexa-NG). Jede Ansage geht gleichzeitig an Ziel 1 und an jedes eingeschaltete Ziel der Tabelle; scheitert eines, sprechen die anderen trotzdem, und die Ansage gilt als gesendet, sobald eines gesprochen hat (Protokoll und Reiter Test nennen jedes Ziel). Ist Ziel 1 aus, spricht keines; mit dem Original-Audioserver als Ziel 1 gehen keine weiteren Ziele. Neues Ziel: die leere Zeile ausfüllen und speichern. Mehrere Zonen desselben Music Servers bzw. mehrere Echos gehören in EIN Ziel (Zonenliste, Kommaliste, gruppe:&lt;Name&gt;). Das Sprechtoken steht einmal oben und gilt für alle Ziele dieser Art. Im Reiter Test spricht <i>Testansage</i> an alle Ziele, <i>Testansage an Ziel n</i> nur an dieses. Vor einem Zurückgehen auf eine Fassung vor 2.1.20 die weiteren Ziele entfernen – ältere Fassungen kennen die Liste nicht und fielen beim Laden auf die Werkseinstellung der Sprachausgabe zurück. <b>Sammelthemen und Kabel:</b> Der Reiter <i>MQTT</i> schaltet <span style='font-family:monospace'>haus/fahrzeug/&lt;name&gt;/…</span> (ab Werk an). Ohne Fahrzeugdaten von Renault steht dort überall ein Strich, nur der Zähler läuft. Kabel-Warnung und Mindest-Akku stehen bei der Vorklimatisierung im Reiter Einstellungen."
