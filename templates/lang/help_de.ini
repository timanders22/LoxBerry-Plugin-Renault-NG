; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Renault API"
K02 = "Verbindet Renault-Elektrofahrzeuge (Zoe PH1/PH2, Twingo Electric u. a.) mit dem Loxone Miniserver – über den LoxBerry. Batteriestand, Reichweite, Ladestatus, Kilometerstand, Position u. v. m. werden alle 3 Minuten abgerufen und per <b>MQTT</b> (LoxBerry MQTT Gateway) bereitgestellt. Vorklimatisierung und Ladesteuerung lassen sich aus Loxone heraus auslösen."
K03 = "Basiert auf <a href='https://github.com/db-EV/ZoePHP' target='_blank'>ZoePHP</a> von db-EV."
K04 = "Funktionen"
K05 = "Abruf von Batterie-/Lade-/Fahrzeugdaten über die My-Renault-API (Gigya/Kamereon)"
K06 = "MQTT-Publish über das LoxBerry MQTT Gateway (Topics <code>Renault/&lt;Autoname&gt;/...</code>)"
K07 = "Kommandos: Vorklimatisierung, Sofortladen, Ladeplan ein/aus über den Endpunkt <code>/plugins/renault_ng/index.php?token=&lt;TOKEN&gt;&amp;aktion=acnow</code>"
K08 = "Ladehistorie (CSV) mit Diagramm-Seite"
K09 = "Reiter <b>Einstellungen</b>, <b>MQTT</b>, <b>Einbindung in Loxone</b> (Schritt für Schritt mit kompletter Baustein-Liste), <b>Test</b>, <b>Ladehistorie</b> und <b>Logdateien</b>"
K10 = "Version 1.4.1"
K11 = "Tippfehler korrigiert: MQTT-Topic heißt jetzt <code>ChargingStatus</code> (vorher <code>CargingStatus</code>, ohne h). <b>Achtung:</b> in der Loxone-Konfiguration muss das Topic entsprechend angepasst werden."
K12 = "Menü-Reiter umbenannt: <b>Einstellungen</b> (vorher „Settings“), <b>gesp. Konfiguration</b> (vorher „Konfiguration“) und <b>Ladehistorie</b> (vorher „Load History“)"
K13 = "Version 1.4"
K14 = "Konfiguration, Ladehistorie und Log <b>überstehen Plugin-Updates</b> (Sicherung/Wiederherstellung über pre-/postupgrade; zusätzlich dauerhafte Konfigurationssicherung im LoxBerry-Config-Verzeichnis)"
K15 = "Neuer Reiter <b>Anleitung</b>: Einbindung in Loxone Schritt für Schritt (MQTT Gateway, Topics-Tabelle, Virtuelle Ausgänge, Beispiele, Stolperfallen)"
K16 = "Einheitliches LoxBerry-Grün auf allen Plugin-Seiten"
K17 = "Installation"
K18 = "ZIP über die LoxBerry-Pluginverwaltung installieren, dann unter <b>Settings</b> die My-Renault-Zugangsdaten, VIN und Fahrzeuggeneration eintragen. Alles Weitere erklärt der Reiter <b>Anleitung</b> im Plugin."
K19 = "Hinweise"
K20 = "Max. 1 API-Abruf pro Minute (wird automatisch eingehalten)"
K21 = "Bei „There is no data for this vin and uid“: Datenfreigabe im Fahrzeug aktivieren und prüfen, ob die My-Renault-App Live-Daten zeigt"
K22 = "Die Zugangsdaten bleiben lokal auf dem LoxBerry (config.php, passwortgeschützter Bereich)"
