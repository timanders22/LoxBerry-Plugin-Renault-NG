; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Renault API"
K02 = "Connects Renault electric vehicles (Zoe PH1/PH2, Twingo Electric and others) to the Loxone Miniserver – through the LoxBerry. State of charge, range, charging state, odometer, position and much more are fetched every 3 minutes and published via <b>MQTT</b> (LoxBerry MQTT gateway). Pre-conditioning and charge control can be triggered from Loxone."
K03 = "Based on <a href='https://github.com/db-EV/ZoePHP' target='_blank'>ZoePHP</a> by db-EV."
K04 = "Features"
K05 = "Fetching battery, charging and vehicle data through the My Renault API (Gigya/Kamereon)"
K06 = "MQTT publishing through the LoxBerry MQTT gateway (topics <code>Renault/&lt;car name&gt;/...</code>)"
K07 = "Commands: pre-conditioning, charge now, charge schedule on/off through the endpoint <code>/plugins/renault_ng/index.php?token=&lt;TOKEN&gt;&amp;aktion=acnow</code>"
K08 = "Charging history (CSV) with a chart page"
K09 = "Tabs <b>Settings</b>, <b>MQTT</b>, <b>Loxone integration</b> (step by step with a complete list of blocks), <b>Test</b>, <b>Charging history</b> and <b>Log files</b>"
K10 = "Version 1.4.1"
K11 = "Typo corrected: the MQTT topic is now called <code>ChargingStatus</code> (previously <code>CargingStatus</code>, without the h). <b>Note:</b> the topic has to be adjusted accordingly in the Loxone configuration."
K12 = "Menu tabs renamed: <b>Settings</b> (previously „Settings“), <b>saved configuration</b> (previously „Konfiguration“) and <b>Charging history</b> (previously „Load History“)"
K13 = "Version 1.4"
K14 = "Configuration, charging history and log <b>survive plugin updates</b> (backup and restore through pre-/postupgrade; additionally a permanent configuration backup in the LoxBerry config directory)"
K15 = "New tab <b>Instructions</b>: Loxone integration step by step (MQTT gateway, topic table, virtual outputs, examples, pitfalls)"
K16 = "Consistent LoxBerry green across all plugin pages"
K17 = "Installation"
K18 = "Install the ZIP through the LoxBerry plugin management, then enter the My Renault credentials, VIN and vehicle generation under <b>Settings</b>. Everything else is explained on the <b>Instructions</b> tab inside the plugin."
K19 = "Notes"
K20 = "At most 1 API call per minute (observed automatically)"
K21 = "If you see „There is no data for this vin and uid“: switch on data sharing in the vehicle and check whether the My Renault app shows live data"
K22 = "The credentials stay local on the LoxBerry (config.php, password-protected area)"
