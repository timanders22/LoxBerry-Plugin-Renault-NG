; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the
; help file and looks for it in templates/lang/ - not next to the help
; file. Every value is enclosed in double quotes and contains none
; itself; markup stays raw, the help is not output escaped.

[HILFE]
K01 = "Renault NG"
K02 = "Connects Renault electric vehicles (Zoe PH1/PH2, Twingo Electric and others) to the Loxone Miniserver – via the LoxBerry. Battery level, range, charging status, odometer, position and more are retrieved regularly and published via <b>MQTT</b> (LoxBerry MQTT gateway). Preconditioning and charge control can be triggered from Loxone."
K03 = "Continuation of PeterB's Renault plugin, which in turn builds on <a href='https://github.com/db-EV/ZoePHP' target='_blank'>ZoePHP</a> by db-EV. Apache License 2.0; the list of changes is in NOTICE."
K04 = "Features"
K05 = "Retrieval of battery, charging and vehicle data via the My Renault interface (Gigya/Kamereon), for up to four vehicles of the same account"
K06 = "MQTT via the LoxBerry MQTT gateway <b>V2</b>: tick the data points one by one (table on the MQTT tab), states retained, measurements and heartbeat without retain, numeric topics without a value with a missing value (-1, temperatures -99, GPS -999). Topics <code>Renault/&lt;vehicle name&gt;/...</code>"
K07 = "Commands via the <b>command bridge</b> (MQTT, <code>Renault/befehl/laden</code>, <code>klima_an</code>, <code>klima_aus</code>, <code>ladeplan</code>, <code>auffrischen</code>, <code>aussentemp</code>; vehicles 2–4 under <code>Renault/befehl/&lt;n&gt;/…</code>) with acknowledgement, off by default. The previous endpoint <code>/plugins/renault_ng/index.php?token=…&amp;aktion=acnow</code> stays open on update and is off on a new installation. Switching commands only work with <i>Switching</i>."
K08 = "Charging history with a daily chart, failure detection via the heartbeat <code>status/zaehler</code> and the topic <code>ok</code>"
K09 = "Tabs <b>Settings</b>, <b>MQTT</b>, <b>Loxone integration</b> (step by step with three pages from the sample project, tables and pictures), <b>Test</b>, <b>Charging history</b> and <b>Log files</b>"
K10 = "New in 2.1.20"
K11 = "<b>Gateway V2 and command bridge:</b> list of data points to tick with the Noncached flag, self-test against <code>subscriptions.json</code>, MQTT header line; commands from Loxone via UDP 11884 to the bridge (reachable in the home network without login – the protection is the checkboxes <i>Accept commands via MQTT</i> and <i>Switching</i>). The same-value brake (the same setpoint within 60 s goes to Renault only once) now applies to all paths."
K12 = "<b>Fixed:</b> changing the account discards the login; saving deletes the markers only on a changed VIN, phase or credentials, and the update rescues them; recording only writes on a change (the update merges old identical lines once, with a backup); the backup on update is atomic; uninstall no longer follows a link; the Test tab reloads; cron errors go to <code>cron.err</code>; speech output also via Sonos4Lox and SonoX (module 1.2.0)."
K13 = "New in the user interface"
K14 = "Retrieval interval, notification threshold, mail and command triggers, weather key and ABRP existed only in the configuration file until 2.0.6. They now have input fields – and are off by default."
K15 = "Up to four vehicles, target temperature for preconditioning, charge target (newer platforms only), daily chart of the charging history"
K16 = "Self-test <code>?selftest=1&amp;token=…</code>: checks the token entered in Loxone without switching anything on the vehicle"
K17 = "Installation"
K18 = "Install the ZIP via the LoxBerry plugin management, then enter the My Renault credentials, the vehicle identification number and the vehicle generation on the <b>Settings</b> tab. Everything else is explained on the <b>Loxone integration</b> tab."
K19 = "Notes"
K20 = "At most one retrieval per minute – the plugin observes this itself"
K21 = "On „There is no data for this vin and uid“: enable data sharing in the vehicle and check whether the My Renault app shows live data. In this case the log lists the vehicle identification numbers linked to the account."
K22 = "The credentials stay local on the LoxBerry, in config.php with permissions 0600"
K23 = "New in 2.1.20 – house topics and automation"
K24 = "<b>Pre-conditioning for departure</b> from <code>haus/abfahrt</code> (departure assistant), optionally only when someone is at home and only when cold or hot; at most two climate-on per departure, then a LoxBerry notification. If the house topic is silent, the plugin does not pre-condition. Use only one source: timer in Loxone or this checkbox."
K25 = "<b>Home zone:</b> <code>Zuhause</code> (1/0/-1) and <code>Entfernung</code> from the GPS position (generation 2); the coordinates are only in the configuration, never in the log or on MQTT."
K26 = "<b>Arrival:</b> when the chosen BLE tag or person changes live to 1, the plugin queries the vehicle once (at most once per 30 min)."
K27 = "<b>Charging costs</b> per charge from <code>haus/strompreis</code>: energy from the energy in the battery reported by the vehicle, otherwise charge level difference × entered capacity; price recorded every minute (the minutes before the detected start from the price forecast, never from the current price); -1 if the price is missing for more than 10 percent of the energy or the energy cannot be determined – never estimated, without charging losses."
K28 = "<b>Messages to SignalBot</b> (charge level reached, charging finished, pre-conditioning failed) via its bridge; works only if SignalBot allows the sender <code>renault_ng</code>. The result of <code>mail()</code> is now in the log."
K29 = "<b>Health check:</b> the LoxBerry system page shows Renault NG (not set up, cron stopped, last success, gateway V2 ticks, command bridge) – read only, without network."
K30 = "The plugin does not control charging by price or surplus; that is what Loxone (wallbox control) and the values of this plugin are for."
K31 = "On the Renault side 2.1.20 has only been tested with mock-ups (no account in the house) – BETA."
K32 = "<b>Several speakers at once</b> (since 2.1.20, speech module 1.2.1): below the output type (now “target 1”) the table <i>Further outputs (simultaneous)</i> takes up to 6 targets in total, for example Loxone Music Server, Google speakers (Chromecast 4 Lox NG) and Amazon Echo (Alexa-NG). Every announcement goes to target 1 and to every enabled target of the table at the same time; if one fails the others still speak, and the announcement counts as sent as soon as one has spoken (the log and the Test tab name every target). If target 1 is off, none speaks; the original Audio Server as target 1 cannot be combined with further targets. New target: fill in the empty row and save. Several zones of the same Music Server or several Echos belong in ONE target (zone list, comma list, gruppe:&lt;name&gt;). The speech token is entered once above and applies to all targets of that kind. In the Test tab <i>Test announcement</i> speaks to all targets, <i>Test announcement to target n</i> only to that one. Before going back to a version older than 2.1.20 remove the further targets – older versions do not know the list and would fall back to the factory settings of the speech output. <b>Collective topics and cable:</b> Tab <i>MQTT</i> switches <span style='font-family:monospace'>haus/fahrzeug/&lt;name&gt;/…</span> (on by default). Without vehicle data from Renault every value there is a dash and only the counter runs. The cable warning and the minimum battery are with the pre-conditioning settings in tab Settings."
